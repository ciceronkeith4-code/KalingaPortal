<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalinga Portal | Barangay 603 Health Portal - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/shared/css/styles.css">
  <link rel="stylesheet" href="/auth/login-bg-icons.css">
</head>
<body>
  <div class="landing-layout">

    <!-- Top Navigation Bar (Header) -->
    <header class="top-nav">
      <div class="brand-identity">
        <div class="brand-logo-mark">
          <img src="/assets/kalinga-logo.png" alt="Kalinga Portal Logo" class="brand-logo-img">
        </div>
        <span class="brand-title">Kalinga Portal</span>
      </div>
    </header>

    <!-- Decorative Background Icons Layer (Purely visual, non-interactive) -->
    <div id="login-bg-icons" class="bg-icons-container" aria-hidden="true">
      <!-- Left Flank Icons -->
      <div class="bg-icon bg-icon--stethoscope">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true">
            <path d="M4.5 4.5v4a3.5 3.5 0 0 0 7 0v-4" />
            <path d="M3.5 4.5h2" />
            <path d="M10.5 4.5h2" />
            <path d="M8 12v3.5a4.5 4.5 0 0 0 9 0V11" />
            <circle cx="17" cy="9" r="2" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--heart-pulse bg-icon--accent">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="42" height="42" aria-hidden="true">
            <path d="M19.5 12.5c0 4.2-7.5 8.5-7.5 8.5s-7.5-4.3-7.5-8.5a4.5 4.5 0 0 1 7.5-3.3 4.5 4.5 0 0 1 7.5 3.3z" />
            <path d="M2.5 12.5h3.5l2-3.5 3 7 2.5-5 1.5 2h5.5" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--clipboard">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <rect x="4.5" y="4.5" width="15" height="16.5" rx="2" />
            <path d="M9 4.5V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1.5" />
            <line x1="8.5" y1="9.5" x2="15.5" y2="9.5" />
            <line x1="8.5" y1="13.5" x2="15.5" y2="13.5" />
            <line x1="8.5" y1="17.5" x2="12.5" y2="17.5" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--capsule bg-icon--accent">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <rect x="8.5" y="3.5" width="7" height="17" rx="3.5" transform="rotate(45 12 12)" />
            <line x1="7" y1="12" x2="17" y2="12" transform="rotate(45 12 12)" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--house">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
            <path d="M3.5 10.5 12 3.5l8.5 7" />
            <path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5" />
            <path d="M10 21v-5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V21" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--thermometer">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
            <path d="M14 4a2 2 0 0 0-4 0v9.17a4 4 0 1 0 4 0V4z" />
            <circle cx="12" cy="17" r="1.5" fill="currentColor" />
            <line x1="12" y1="10" x2="12" y2="15.5" />
            <line x1="10" y1="7" x2="8.5" y2="7" />
            <line x1="10" y1="10" x2="8.5" y2="10" />
          </svg>
        </div>
      </div>

      <!-- Right Flank Icons -->
      <div class="bg-icon bg-icon--shield-check">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
            <path d="M12 3s7 2 7 8c0 5-4.5 8.5-7 10-2.5-1.5-7-5-7-10 0-6 7-8 7-8z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--cross bg-icon--accent">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
            <path d="M9 4.5h6v4.5h4.5v6H15v4.5H9V15H4.5V9H9V4.5z" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--med-bag">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true">
            <rect x="3.5" y="7.5" width="17" height="13" rx="2.5" />
            <path d="M9 7.5V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2.5" />
            <line x1="12" y1="11" x2="12" y2="17" />
            <line x1="9" y1="14" x2="15" y2="14" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--syringe">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <path d="m18 3 3 3" />
            <path d="m14 7 3-3" />
            <path d="m19 10 1-1" />
            <path d="m6 18-3 3" />
            <path d="m6.5 14.5 3 3L18 9l-3-3L6.5 14.5z" />
            <path d="m14 5 5 5" />
            <line x1="9.5" y1="11.5" x2="11.5" y2="13.5" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--calendar">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="16" rx="2" />
            <line x1="8" y1="2.5" x2="8" y2="5.5" />
            <line x1="16" y1="2.5" x2="16" y2="5.5" />
            <line x1="3.5" y1="9.5" x2="20.5" y2="9.5" />
            <circle cx="8" cy="13.5" r="0.75" fill="currentColor" />
            <circle cx="12" cy="13.5" r="0.75" fill="currentColor" />
            <circle cx="16" cy="13.5" r="0.75" fill="currentColor" />
            <circle cx="8" cy="16.5" r="0.75" fill="currentColor" />
            <circle cx="12" cy="16.5" r="0.75" fill="currentColor" />
          </svg>
        </div>
      </div>

      <div class="bg-icon bg-icon--bottle">
        <div class="bg-icon__inner">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
            <rect x="6" y="8" width="12" height="13" rx="2" />
            <path d="M9 4.5h6v3.5H9z" />
            <line x1="12" y1="12" x2="12" y2="16" />
            <line x1="10" y1="14" x2="14" y2="14" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Main Split Hero Stage (No huge spaces) -->
    <main class="hero-stage">

      <div class="hero-content-grid">

        <!-- Left Side: Content & Login Form (Completely preserved as requested) -->
        <section class="left-form-column">
          <div class="content-wrapper">

            <!-- Two-line bold headline -->
            <h1 class="hero-headline">
              Healthcare powered by <span class="text-accent">Kalinga</span>
            </h1>

            <p class="hero-description">
              Accessible, secure, and centralized health profiling for the residents and medical team of Barangay 603, Manila. Fast and organized records without delay.
            </p>

            <!-- Accessible Login Form -->
            <form id="login-form" novalidate>
              <div class="input-field-group">
                <label for="username">Username</label>
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  placeholder="Enter your username" 
                  autocomplete="username" 
                  spellcheck="false"
                  required
                >
              </div>

              <div class="input-field-group">
                <label for="password">Password</label>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  placeholder="Enter your password" 
                  autocomplete="current-password" 
                  required
                >
              </div>

              <div class="form-aux-row">
                <label class="show-password-field" for="toggle-password">
                  <input type="checkbox" id="toggle-password">
                  <span>Show password</span>
                </label>

                <a href="#" class="forgot-password-link">Forgot Password?</a>
              </div>

              <div id="login-error" class="error-banner" hidden role="alert"></div>

              <!-- Solid Red Primary Sign In Button -->
              <div class="button-row">
                <button type="submit" id="submit-btn" class="sign-in-btn">
                  <span>SIGN IN</span>
                  <svg class="btn-arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>
            </form>

          </div>
        </section>

      </div>
    </main>

  </div>

  <script src="/shared/js/data.js"></script>
  <script src="/auth/login.js"></script>
  <script src="/auth/login-bg-icons.js"></script>
</body>
</html>
