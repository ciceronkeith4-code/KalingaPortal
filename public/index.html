<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalinga Portal | Barangay 603 Health Portal - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/shared/css/styles.css">
  <link rel="stylesheet" href="/auth/login-bg-dna.css">
  <link rel="stylesheet" href="/auth/intro.css">
  <script>
    (function () {
      try {
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var hasSession = false;
        try { hasSession = !!sessionStorage.getItem('kalinga_session'); } catch (e) {}
        if (!reduced && !hasSession) {
          document.documentElement.classList.add('has-anime-intro');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Smooth Color-Connected Intro Overlay (Anime.js) -->
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-backdrop-base" aria-hidden="true"></div>
    <div class="intro-sweep-red" aria-hidden="true"></div>
    <div class="intro-sweep-navy" aria-hidden="true"></div>

    <div class="intro-stage" aria-hidden="true">
      <div class="intro-emblem">
        <svg class="intro-emblem-svg" viewBox="0 0 108 108" width="108" height="108">
          <circle class="intro-ring-track" cx="54" cy="54" r="48" />
          <circle class="intro-ring-navy" cx="54" cy="54" r="48" />
        </svg>
        <div class="intro-logo-wrap">
          <img src="/assets/kalinga-logo.png" alt="" class="intro-logo-img">
        </div>
        <div class="intro-pulse-badge">
          <svg class="intro-pulse-svg" viewBox="0 0 24 24" width="22" height="22">
            <path class="intro-pulse-red" d="M2.5 12.5h4l2-4.5 3 8.5 2.5-6 1.5 2h6" />
          </svg>
        </div>
      </div>

      <span class="intro-eyebrow">Barangay 603 &middot; Manila</span>
      <div class="intro-wordmark">
        Kalinga <span class="intro-wordmark-accent">Portal</span>
      </div>
      <p class="intro-subtitle">Centralized Community Health Records</p>

      <div class="intro-progress-track">
        <div class="intro-progress-navy"></div>
      </div>
    </div>

    <button type="button" id="intro-skip-btn" class="intro-skip-btn">Skip intro</button>
  </div>

  <div class="landing-layout">

    <!-- Top Navigation Bar (Header) -->
    <header class="top-nav">
      <div class="brand-identity">
        <div class="brand-logo-mark">
          <img src="/assets/kalinga-logo.png" alt="Kalinga Portal Logo" class="brand-logo-img">
        </div>
        <span class="brand-title">Kalinga Portal</span>
      </div>
    </header>

    <!-- Decorative Three.js DNA, Atoms, Molecules & Particles Background Layer -->
    <div id="login-bg-dna" class="bg-dna-container" aria-hidden="true">
      <canvas id="login-bg-canvas" class="bg-dna-canvas"></canvas>
      <div class="bg-dna-center-mask"></div>
    </div>

    <!-- Main Split Hero Stage (No huge spaces) -->
    <main class="hero-stage">

      <div class="hero-content-grid">

        <!-- Left Side: Content & Login Form (Completely preserved as requested) -->
        <section class="left-form-column">
          <div class="content-wrapper">

            <!-- Two-line bold headline -->
            <h1 class="hero-headline">
              Healthcare powered by <span class="text-accent">Kalinga</span>
            </h1>

            <p class="hero-description">
              Accessible, secure, and centralized health profiling for the residents and medical team of Barangay 603, Manila. Fast and organized records without delay.
            </p>

            <!-- Accessible Login Form -->
            <form id="login-form" novalidate>
              <div class="input-field-group">
                <label for="username">Username</label>
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  placeholder="Enter your username" 
                  autocomplete="username" 
                  spellcheck="false"
                  required
                >
              </div>

              <div class="input-field-group">
                <label for="password">Password</label>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  placeholder="Enter your password" 
                  autocomplete="current-password" 
                  required
                >
              </div>

              <div class="form-aux-row">
                <label class="show-password-field" for="toggle-password">
                  <input type="checkbox" id="toggle-password">
                  <span>Show password</span>
                </label>

                <a href="#" class="forgot-password-link">Forgot Password?</a>
              </div>

              <div id="login-error" class="error-banner" hidden role="alert"></div>

              <!-- Solid Red Primary Sign In Button -->
              <div class="button-row">
                <button type="submit" id="submit-btn" class="sign-in-btn">
                  <span>SIGN IN</span>
                  <svg class="btn-arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>
            </form>

          </div>
        </section>

      </div>
    </main>

  </div>

  <script src="/shared/js/anime.umd.min.js"></script>
  <script src="/shared/js/data.js"></script>
  <script src="/auth/intro.js"></script>
  <script src="/auth/login.js"></script>
  <script type="module" src="/auth/login-bg-dna.js"></script>
</body>
</html>
